<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Academics - Violan SkillBridge Arena</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0a192f;
    color: white;
}

header {
    background: #020c1b;
    text-align: center;
    padding: 15px;
}

header h1 {
    color: #64ffda;
}

nav {
    background: #112240;
    text-align: center;
}

nav a {
    color: white;
    padding: 12px 18px;
    display: inline-block;
    text-decoration: none;
}

nav a:hover {
    background: #233554;
}

.section {
    padding: 20px;
    border-bottom: 1px solid #233554;
}

h2, h3 {
    color: #64ffda;
}

.quiz-box {
    background: #112240;
    padding: 15px;
    margin-top: 10px;
    border-radius: 5px;
}

button {
    margin-top: 15px;
    padding: 10px 15px;
    background: #64ffda;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #52e0c4;
}

#result {
    margin-top: 15px;
    font-size: 18px;
    color: #64ffda;
}

footer {
    background: #020c1b;
    text-align: center;
    padding: 10px;
}
</style>
</head>

<body>

<header>
    <h1>Violan SkillBridge Arena - Academics</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="sports.html">Sports</a>
    <a href="academics.html">Academics</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>
</nav>

<div class="section">
    <h2>Quick Interactive Quiz</h2>

    <!-- Question 1 -->
    <div class="quiz-box">
        <p>1. What is 12 × 8?</p>
        <label><input type="radio" name="q1" value="a"> 96</label><br>
        <label><input type="radio" name="q1" value="b"> 88</label><br>
        <label><input type="radio" name="q1" value="c"> 108</label>
    </div>

    <!-- Question 2 -->
    <div class="quiz-box">
        <p>2. Capital city of Uganda?</p>
        <label><input type="radio" name="q2" value="a"> Nairobi</label><br>
        <label><input type="radio" name="q2" value="b"> Kampala</label><br>
        <label><input type="radio" name="q2" value="c"> Kigali</label>
    </div>

    <!-- Question 3 -->
    <div class="quiz-box">
        <p>3. Which subject studies living things?</p>
        <label><input type="radio" name="q3" value="a"> Physics</label><br>
        <label><input type="radio" name="q3" value="b"> Biology</label><br>
        <label><input type="radio" name="q3" value="c"> Geography</label>
    </div>

    <button onclick="checkAnswers()">Submit Quiz</button>

    <div id="result"></div>
</div>

<footer>
    <p>© 2026 Violan SkillBridge Arena</p>
</footer>

<script>
function checkAnswers() {
    let score = 0;

    let q1 = document.querySelector('input[name="q1"]:checked');
    let q2 = document.querySelector('input[name="q2"]:checked');
    let q3 = document.querySelector('input[name="q3"]:checked');

    if (q1 && q1.value === "a") score++;
    if (q2 && q2.value === "b") score++;
    if (q3 && q3.value === "b") score++;

    let result = document.getElementById("result");
    result.innerHTML = "You scored " + score + " out of 3 🎯";

    if (score === 3) {
        result.innerHTML += " - Excellent!";
    } else if (score === 2) {
        result.innerHTML += " - Good job!";
    } else {
        result.innerHTML += " - Keep practicing!";
    }
}
</script>

</body>
</html>
